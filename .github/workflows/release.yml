name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests with coverage
        run: npx vitest run --coverage

      - name: Build packages
        run: npm run build

      - name: Verify package contents
        run: |
          npm pack -w packages/protocol --dry-run
          npm pack -w packages/core --dry-run
          npm pack -w packages/android --dry-run
          npm pack -w packages/ios --dry-run
          npm pack -w packages/test --dry-run
          npm pack -w packages/cli --dry-run
          npm pack -w packages/astur-mobile --dry-run
          npm pack -w packages/create-astur --dry-run

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Disable errexit: publish() handles failures itself, and we must not
          # let a single non-zero `npm publish` (e.g. an already-published
          # version) abort the whole loop before later packages are tried.
          set +e
          # Retry each publish — npm provenance occasionally hits a transient
          # Sigstore transparency-log error (TLOG_CREATE_ENTRY_ERROR / 409).
          publish() {
            for attempt in 1 2 3; do
              if out=$(npm publish -w "$1" --access public --provenance --tag "${{ inputs.tag }}" 2>&1); then
                echo "$out"
                return 0
              fi
              echo "$out"
              # Idempotent: a version already on the registry is fine (lets a
              # re-run finish a partial release without bumping the version).
              if echo "$out" | grep -qiE "cannot publish over|previously published"; then
                echo "::notice::$1 already published at this version — skipping"
                return 0
              fi
              echo "::warning::publish $1 failed (attempt $attempt) — retrying in 20s"
              sleep 20
            done
            echo "::error::publish $1 failed after 3 attempts"
            return 1
          }
          rc=0
          for pkg in protocol core android ios test cli astur-mobile create-astur; do
            publish "packages/$pkg" || rc=1
          done
          exit $rc
