name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests with coverage
        run: npx vitest run --coverage

      - name: Build packages
        run: npm run build

      - name: Verify package contents
        run: |
          npm pack -w packages/protocol --dry-run
          npm pack -w packages/core --dry-run
          npm pack -w packages/android --dry-run
          npm pack -w packages/ios --dry-run
          npm pack -w packages/test --dry-run
          npm pack -w packages/cli --dry-run
          npm pack -w packages/astur-mobile --dry-run
          npm pack -w packages/create-astur --dry-run

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Retry each publish — npm provenance occasionally hits a transient
          # Sigstore transparency-log error (TLOG_CREATE_ENTRY_ERROR / 409).
          publish() {
            for attempt in 1 2 3; do
              if npm publish -w "$1" --access public --provenance --tag "${{ inputs.tag }}"; then
                return 0
              fi
              echo "::warning::publish $1 failed (attempt $attempt) — retrying in 20s"
              sleep 20
            done
            echo "::error::publish $1 failed after 3 attempts"
            return 1
          }
          publish packages/protocol
          publish packages/core
          publish packages/android
          publish packages/ios
          publish packages/test
          publish packages/cli
          publish packages/astur-mobile
          publish packages/create-astur
